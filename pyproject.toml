[project]
name = "vessel-knowledge-graph"
version = "0.1.0"
description = "Defect casefiles to structured facts to a fleet-wide knowledge graph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.30.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# Langfuse tracing. Optional: without it, src/utils/observability.py is a no-op.
observability = ["langfuse>=3.0.0,<4"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: needs real credentials (LLM, Mongo, S3); skipped when absent",
]

[tool.ruff]
line-length = 100
target-version = "py313"
